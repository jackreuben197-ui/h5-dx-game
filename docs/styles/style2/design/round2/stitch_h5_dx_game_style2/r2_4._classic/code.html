<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=440, height=782, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>R2: classic经典双排公共牌 (440x782)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    width: 440px; height: 782px; overflow: hidden;
    background: #F9F2E7;
    font-family: 'Fredoka', 'Noto Sans SC', 'Nunito', sans-serif;
    color: #4A3E3D; position: relative;
  }
  .table-stage {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 35%, #FFFDF9 0%, #F6ECDD 70%, #EBDBC5 100%);
    overflow: hidden;
  }

  /* 跑道型经典毛毡桌面 (曲奇外框+薄荷绿跑道) */
  .poker-felt-classic {
    position: absolute; left: 24px; top: 68px; width: 392px; height: 590px;
    border-radius: 196px;
    background: radial-gradient(circle at 50% 40%, #76E5C5 0%, #48CEAA 65%, #35BA96 100%);
    box-shadow: 
      inset 0 6px 12px rgba(255,255,255,0.65),
      inset 0 -8px 16px rgba(18, 92, 72, 0.3),
      0 0 0 8px #FFEAA7, 0 0 0 14px #6C5295, 0 12px 24px rgba(108, 82, 149, 0.22);
  }

  /* 顶部状态栏 */
  .top-bar {
    position: absolute; top: 12px; left: 16px; right: 16px; height: 44px;
    display: flex; justify-content: space-between; align-items: center; z-index: 50;
  }
  .btn-soft-pill {
    width: 38px; height: 38px; border-radius: 13px;
    background: #FFFFFF; border: 2px solid #EAD8C0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 #D4BEA2; color: #6C5295; font-size: 15px; font-weight: 900;
  }
  .chip-pill-btn {
    height: 36px; padding: 0 10px 0 6px; border-radius: 18px;
    background: #FFFFFF; border: 2px solid #EAD8C0;
    display: flex; align-items: center; gap: 6px; color: #5D4037; font-size: 13px; font-weight: 800;
  }
  .toy-chip-icon {
    width: 24px; height: 24px; border-radius: 50%;
    background: radial-gradient(circle, #54E1FF 20%, #00A8FF 100%);
    border: 2px dashed #FFF; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 900; color: #004D73;
  }

  /* 经典双道底池 */
  .pot-dual-zone {
    position: absolute; top: 164px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 3px; z-index: 25;
  }
  .pot-pill-main {
    background: rgba(108, 82, 149, 0.92); border: 2px solid #FFEAA7;
    border-radius: 15px; padding: 3px 14px; color: #FFF; font-size: 13px; font-weight: 900;
  }

  /* 核心：纯净双排公共牌展示区 (不含开发术语，第一排5槽，第二排实发3张) */
  .dual-board-container {
    position: absolute; top: 226px; left: 50%; transform: translateX(-50%);
    width: 300px; display: flex; flex-direction: column; align-items: center; z-index: 30;
  }

  /* 行标识：简洁游戏内语义 (道1 / 道2) */
  .board-tag-line {
    align-self: flex-start; margin-left: 18px; margin-bottom: 3px;
    background: #6C5295; color: #FFEAA7; font-size: 10px; font-weight: 900;
    padding: 1px 7px; border-radius: 6px; border: 1px solid #896BB8;
  }

  /* 第一排：固定五槽 (4张已发牌 + 1张曲奇虚线占位槽) */
  .board-row-first {
    display: flex; gap: 6px; position: relative; z-index: 2; margin-bottom: -16px;
  }
  /* 第二排：按实发张数渲染 (当前Flop阶段只画实际3张，绝无伪造假槽) */
  .board-row-second {
    display: flex; gap: 6px; position: relative; z-index: 3; padding-top: 14px;
  }

  /* 可爱扑克牌样式 */
  .poker-card {
    width: 46px; height: 64px; border-radius: 10px;
    background: #FFFFFF; border: 2px solid #F0E6D8;
    box-shadow: 0 4px 8px rgba(90, 60, 40, 0.18);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 3px 4px; position: relative;
  }
  .poker-card .val { font-size: 17px; font-weight: 900; line-height: 1; }
  .poker-card .suit { font-size: 12px; line-height: 1; }
  .poker-card .suit-big { position: absolute; right: 3px; bottom: 2px; font-size: 20px; line-height: 1; opacity: 0.92; }
  .poker-card.red { color: #FF4757; }
  .poker-card.black { color: #2F3542; }

  /* 第一排未翻开占位槽 (柔和米白曲奇虚线) */
  .poker-slot-empty {
    width: 46px; height: 64px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.35);
    border: 2px dashed rgba(108, 82, 149, 0.45);
    display: flex; align-items: center; justify-content: center;
    color: rgba(108, 82, 149, 0.6); font-size: 15px; font-weight: 900;
  }

  /* 房间信息 */
  .room-info-badge {
    position: absolute; top: 412px; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; z-index: 10;
  }
  .room-info-badge .title { font-size: 11px; color: rgba(255, 255, 255, 0.85); font-weight: 700; }
  .room-info-badge .meta { font-size: 11px; color: #FFF3BF; font-weight: 800; }

  /* 周边座位 */
  .seat-node { position: absolute; display: flex; flex-direction: column; align-items: center; z-index: 25; }
  .cookie-avatar-wrap {
    width: 48px; height: 48px; border-radius: 17px; background: #FFEAA7; padding: 3px;
    box-shadow: 0 4px 0 #DAB968;
  }
  .cookie-avatar-img { width: 100%; height: 100%; border-radius: 14px; object-fit: cover; }
  .seat-name-pill {
    margin-top: -6px; max-width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: #6C5295; color: #FFEAA7; font-size: 9px; font-weight: 800; padding: 1px 6px; border-radius: 7px;
  }
  .seat-chips-pill {
    margin-top: 1px; background: #FFFFFF; color: #5D4037; font-size: 10px; font-weight: 900;
    padding: 1px 6px; border-radius: 7px; border: 1.5px solid #EAD8C0;
  }

  /* 视口贴边加时与聊天 */
  .viewport-side-timer {
    position: absolute; bottom: 138px; left: 10px; z-index: 45;
    background: #FFFFFF; border: 2px solid #6C5295;
    border-radius: 15px; padding: 4px 7px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    box-shadow: 0 3px 0 #D4BEA2; cursor: pointer;
  }
  .btn-chat-bubble {
    position: absolute; bottom: 82px; left: 10px; z-index: 45;
    width: 40px; height: 40px; border-radius: 14px;
    background: #FFFFFF; border: 2px solid #EAD8C0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 #D4BEA2; color: #6C5295; cursor: pointer;
  }

  /* 底部本人手牌区 */
  .self-classic-group {
    position: absolute; bottom: 62px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; z-index: 40;
  }
  .self-cards-row { display: flex; gap: 5px; }

  /* 底栏 */
  .bottom-dock {
    position: absolute; bottom: 0; left: 0; right: 0; height: 50px;
    background: #FFFFFF; border-top: 2px solid #EAD8C0;
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 10px; z-index: 50;
  }
  .dock-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #6C5295; }
</style>
</head>
<body>
<div class="table-stage">
  <!-- 经典跑道型毛毡桌面 -->
  <div class="poker-felt-classic"></div>

  <!-- 顶部导航 -->
  <div class="top-bar">
    <div class="btn-soft-pill">◀</div>
    <div class="chip-pill-btn"><div class="toy-chip-icon">◈</div><span>经典双排模式</span></div>
    <div class="btn-soft-pill">⚙</div>
  </div>

  <!-- 经典双道底池 -->
  <div class="pot-dual-zone">
    <div class="pot-pill-main">双道总底池: 120 BB</div>
  </div>

  <!-- 双排公共牌主体 (纯净UI，设计术语全部剥离至独立文档) -->
  <div class="dual-board-container">
    <div class="board-tag-line">第一道</div>
    <!-- 第一排：固定五槽 (4张牌 + 1个未开河牌占位槽) -->
    <div class="board-row-first">
      <div class="poker-card black"><div class="val">A</div><div class="suit">♠</div><div class="suit-big">♠</div></div>
      <div class="poker-card red"><div class="val">K</div><div class="suit">♥</div><div class="suit-big">♥</div></div>
      <div class="poker-card black"><div class="val">10</div><div class="suit">♣</div><div class="suit-big">♣</div></div>
      <div class="poker-card red"><div class="val">2</div><div class="suit">♦</div><div class="suit-big">♦</div></div>
      <div class="poker-slot-empty">?</div>
    </div>

    <div class="board-tag-line" style="margin-top: 12px;">第二道</div>
    <!-- 第二排：实际3张 (无假槽，高光立体凸显) -->
    <div class="board-row-second">
      <div class="poker-card red" style="border-color:#FFA94D; box-shadow:0 6px 12px rgba(255,169,77,0.3);"><div class="val">J</div><div class="suit">♦</div><div class="suit-big">♦</div></div>
      <div class="poker-card black" style="border-color:#FFA94D; box-shadow:0 6px 12px rgba(255,169,77,0.3);"><div class="val">8</div><div class="suit">♠</div><div class="suit-big">♠</div></div>
      <div class="poker-card red" style="border-color:#FFA94D; box-shadow:0 6px 12px rgba(255,169,77,0.3);"><div class="val">5</div><div class="suit">♥</div><div class="suit-big">♥</div></div>
    </div>
  </div>

  <!-- 房间信息 -->
  <div class="room-info-badge">
    <div class="title">德州-双排竞技 · 909090-12</div>
    <div class="meta">两道独立判定 · 盲注 0.10/0.20</div>
  </div>

  <!-- 7名经典对手分布 -->
  <div class="seat-node" style="top: 86px; left: 50%; transform: translateX(-50%);">
    <div class="cookie-avatar-wrap"><img class="cookie-avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80"></div>
    <div class="seat-name-pill">顶部甲</div><div class="seat-chips-pill">2.4K BB</div>
  </div>
  <div class="seat-node" style="top: 110px; right: 28px;">
    <div class="cookie-avatar-wrap"><img class="cookie-avatar-img" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80"></div>
    <div class="seat-name-pill">顶部乙</div><div class="seat-chips-pill">1.8K BB</div>
  </div>
  <div class="seat-node" style="top: 110px; left: 28px;">
    <div class="cookie-avatar-wrap"><img class="cookie-avatar-img" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=100&auto=format&fit=crop&q=80"></div>
    <div class="seat-name-pill">左上玩家</div><div class="seat-chips-pill">950 BB</div>
  </div>
  <div class="seat-node" style="top: 220px; right: 18px;">
    <div class="cookie-avatar-wrap"><img class="cookie-avatar-img" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&auto=format&fit=crop&q=80"></div>
    <div class="seat-name-pill">右上玩家</div><div class="seat-chips-pill">1.1K BB</div>
  </div>
  <div class="seat-node" style="top: 220px; left: 18px;">
    <div class="cookie-avatar-wrap"><img class="cookie-avatar-img" src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=100&auto=format&fit=crop&q=80"></div>
    <div class="seat-name-pill">长昵称ABC</div><div class="seat-chips-pill">1.0K BB</div>
  </div>
  <div class="seat-node" style="top: 340px; right: 20px;">
    <div class="cookie-avatar-wrap"><img class="cookie-avatar-img" src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=100&auto=format&fit=crop&q=80"></div>
    <div class="seat-name-pill">右侧玩家</div><div class="seat-chips-pill">850 BB</div>
  </div>
  <div class="seat-node" style="top: 340px; left: 20px;">
    <div class="cookie-avatar-wrap"><img class="cookie-avatar-img" src="https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=100&auto=format&fit=crop&q=80"></div>
    <div class="seat-name-pill">左下玩家</div><div class="seat-chips-pill">780 BB</div>
  </div>

  <!-- 视口贴边加时与聊天 -->
  <div class="viewport-side-timer">
    <div class="timer-txt">⏱ +30s</div>
    <div class="diamond-price">💎 10</div>
  </div>
  <div class="btn-chat-bubble">
    <div class="icon">💬</div><div class="txt">聊天</div>
  </div>

  <!-- 底部本人手牌 -->
  <div class="self-classic-group">
    <div class="cookie-avatar-wrap" style="width:42px; height:42px;">
      <img class="cookie-avatar-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80" alt="self">
    </div>
    <div class="self-cards-row">
      <div class="poker-card black" style="width: 46px; height: 64px;"><div class="val">K</div><div>♠</div><div class="suit-big">♠</div></div>
      <div class="poker-card black" style="width: 46px; height: 64px;"><div class="val">Q</div><div>♠</div><div class="suit-big">♠</div></div>
    </div>
  </div>

  <!-- 底部底栏 -->
  <div class="bottom-dock">
    <div class="dock-item"><div class="dock-icon">🏆</div><div class="dock-label">战绩</div></div>
    <div class="dock-item"><div class="dock-icon">🎖</div><div class="dock-label">牌谱</div></div>
    <div class="dock-item"><div class="dock-icon">😊</div><div class="dock-label">表情</div></div>
  </div>
</div>
</body>
</html>

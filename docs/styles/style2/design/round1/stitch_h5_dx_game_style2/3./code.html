<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=440, height=782, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>稿3: 等待他人行动·自动预选操作 (440x782)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    width: 440px; height: 782px; overflow: hidden;
    background: #201735;
    font-family: 'Fredoka', 'Noto Sans SC', 'Nunito', sans-serif;
    color: #4A3E3D; position: relative;
  }
  .table-stage {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 45%, #3B2B5D 0%, #221838 100%);
  }
  .poker-felt {
    position: absolute; left: 20px; top: 72px; width: 400px; height: 588px;
    border-radius: 170px / 210px;
    background: radial-gradient(circle at 50% 42%, #5CD6B2 0%, #35BA96 68%, #2AA281 100%);
    box-shadow: 
      inset 0 6px 14px rgba(255,255,255,0.4),
      inset 0 -8px 18px rgba(12, 70, 54, 0.45),
      0 0 0 9px #FFE8A3, 0 0 0 16px #493374, 0 14px 28px rgba(0,0,0,0.4);
  }
  /* 顶部状态栏 */
  .top-bar {
    position: absolute; top: 12px; left: 16px; right: 16px; height: 44px;
    display: flex; justify-content: space-between; align-items: center; z-index: 50;
  }
  .btn-pill-icon {
    width: 38px; height: 38px; border-radius: 14px;
    background: #47346E; border: 2px solid #634C94;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 #2A1C46; color: #FFE8A3;
  }
  .chip-pill-btn {
    height: 36px; padding: 0 10px 0 6px; border-radius: 18px;
    background: #4A3370; border: 2px solid #674E98;
    display: flex; align-items: center; gap: 6px;
    color: #FFF; font-size: 13px; font-weight: 700;
  }
  .toy-chip-icon {
    width: 24px; height: 24px; border-radius: 50%;
    background: radial-gradient(circle, #6BE7FF 40%, #009BD6 100%);
    border: 2px dashed #FFF; display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 900; color: #074766;
  }

  /* 底池与公共牌 */
  .pot-zone {
    position: absolute; top: 194px; left: 50%; transform: translateX(-50%);
    background: rgba(30, 20, 52, 0.72); border: 1.5px solid rgba(255, 232, 163, 0.6);
    padding: 3px 14px; border-radius: 14px; color: #FFF; font-size: 14px; font-weight: 900;
  }
  .board-cards-wrap {
    position: absolute; top: 242px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 7px; z-index: 20;
  }
  .poker-card {
    width: 44px; height: 62px; border-radius: 9px;
    background: #FFFFFF; border: 2px solid #EBE4D8;
    box-shadow: 0 4px 6px rgba(0,0,0,0.25);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 3px 4px; position: relative;
  }
  .poker-card .val { font-size: 16px; font-weight: 900; line-height: 1; }
  .poker-card.red { color: #FF4757; }
  .poker-card.black { color: #2F3542; }

  /* 座位通用与对手倒计时环 */
  .seat-node { position: absolute; display: flex; flex-direction: column; align-items: center; z-index: 25; }
  .avatar-wrap {
    width: 52px; height: 52px; border-radius: 18px; background: #FFEAA7;
    padding: 3px; box-shadow: 0 4px 0 #D3B96C; position: relative;
  }
  .avatar-img { width: 100%; height: 100%; border-radius: 15px; object-fit: cover; }
  .seat-name {
    margin-top: -6px; max-width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: #3A2B59; color: #FFE8A3; font-size: 10px; font-weight: 700;
    padding: 1px 6px; border-radius: 7px;
  }
  .seat-chips {
    margin-top: 1px; background: rgba(22, 14, 38, 0.85); color: #FFF; font-size: 10px; font-weight: 800;
    padding: 1px 6px; border-radius: 7px;
  }

  /* 对手行动中：头像发光 + 倒计时进度圈 */
  .opponent-acting .avatar-wrap {
    background: #FF9F43; box-shadow: 0 0 16px rgba(255, 159, 67, 0.9), 0 4px 0 #D35400;
  }
  .opponent-acting-timer-ring {
    position: absolute; inset: -5px; border-radius: 23px;
    border: 3px solid #00D2D3; animation: spinGlow 2s infinite linear;
  }
  @keyframes spinGlow {
    0% { transform: rotate(0deg); opacity: 0.8; }
    50% { opacity: 1; }
    100% { transform: rotate(360deg); opacity: 0.8; }
  }

  /* 对手行动气泡 */
  .action-bubble {
    position: absolute; top: -14px;
    background: linear-gradient(180deg, #FF9F43 0%, #EE5253 100%);
    border: 1.5px solid #FFF; color: #FFF; font-size: 10px; font-weight: 900;
    padding: 1px 8px; border-radius: 10px; box-shadow: 0 3px 5px rgba(0,0,0,0.25);
    white-space: nowrap; z-index: 30;
  }

  /* 本人玩家组 (等待状态) */
  .self-player-group {
    position: absolute; bottom: 58px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; z-index: 40;
  }

  /* 本人手牌 (安静常态，不抖动) */
  .self-hand-center {
    display: flex; flex-direction: column; align-items: center; margin-bottom: 12px;
  }
  .self-cards-row { display: flex; gap: 6px; position: relative; }
  .self-cards-row .poker-card {
    width: 48px; height: 68px; border-radius: 10px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.3); border: 2px solid #FFF;
  }

  /* 状态提示小条：等待他人行动 */
  .waiting-status-toast {
    background: rgba(30, 20, 52, 0.85); border: 1px dashed #A29BFE;
    color: #D6A2E8; font-size: 11px; font-weight: 700;
    padding: 3px 12px; border-radius: 12px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .waiting-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #FF9F43;
    animation: blink 1s infinite alternate;
  }
  @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

  /* 自动预选操作栏 (AutoOperationView) */
  .auto-operation-bar {
    width: 412px; display: flex; justify-content: space-between; gap: 8px;
    padding: 0 10px;
  }

  /* 预选选项药丸盒 (勾选框 + 文案) */
  .auto-op-pill {
    flex: 1; height: 50px; border-radius: 16px;
    background: #3B2A58; border: 2px solid #584180;
    display: flex; align-items: center; gap: 8px; padding: 0 10px;
    box-shadow: 0 3px 0 #241738; cursor: pointer; position: relative;
    transition: all 0.15s ease;
  }
  /* 卡通勾选框 */
  .auto-checkbox {
    width: 20px; height: 20px; border-radius: 7px;
    background: #25183E; border: 2px solid #7D61AC;
    display: flex; align-items: center; justify-content: center;
    color: #FFF; font-size: 12px; font-weight: 900;
  }
  .auto-op-label {
    display: flex; flex-direction: column; justify-content: center;
  }
  .auto-op-label .main-txt { font-size: 12px; font-weight: 800; color: #E0D6F5; line-height: 1.1; }
  .auto-op-label .sub-txt { font-size: 9px; font-weight: 600; color: #9A8BB8; }

  /* 选中状态 (高亮薄荷绿) */
  .auto-op-pill.selected {
    background: linear-gradient(180deg, #10AC84 0%, #0B8062 100%);
    border-color: #55EFC4; box-shadow: 0 4px 0 #064E3B, 0 4px 10px rgba(16, 172, 132, 0.4);
  }
  .auto-op-pill.selected .auto-checkbox {
    background: #FFF; border-color: #55EFC4; color: #0B8062;
  }
  .auto-op-pill.selected .auto-op-label .main-txt { color: #FFF; }
  .auto-op-pill.selected .auto-op-label .sub-txt { color: #DFF9FB; }

  /* 禁用状态 (Disabled) */
  .auto-op-pill.disabled {
    opacity: 0.45; cursor: not-allowed; background: #2A1F3E; border-color: #3F305A;
  }

  /* 底部底栏 */
  .bottom-dock {
    position: absolute; bottom: 0; left: 0; right: 0; height: 52px;
    background: linear-gradient(180deg, rgba(30, 20, 50, 0.95) 0%, #150D24 100%);
    border-top: 2px solid #3E2B63;
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 10px; z-index: 50;
  }
  .dock-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #B8A9D9; }
</style>
</head>
<body>
<div class="table-stage">
  <!-- 桌面毛毡 -->
  <div class="poker-felt"></div>

  <!-- 顶部状态栏 -->
  <div class="top-bar">
    <div class="btn-pill-icon">◀</div>
    <div class="chip-pill-btn">
      <div class="toy-chip-icon">◈</div>
      <span>18.5K</span>
    </div>
    <div class="btn-pill-icon">🎧</div>
  </div>

  <!-- 底池 -->
  <div class="pot-zone">
    <span style="color:#FFE8A3;">底池:</span> 34.50 BB
  </div>

  <!-- 公共牌 (翻牌圈 3张) -->
  <div class="board-cards-wrap">
    <div class="poker-card black"><div class="val">K</div><div>♠</div></div>
    <div class="poker-card red"><div class="val">9</div><div>♥</div></div>
    <div class="poker-card red"><div class="val">4</div><div>♦</div></div>
  </div>

  <!-- 对手座位 (右侧玩家正在思考行动) -->
  <div class="seat-node opponent-acting" style="top: 340px; right: 24px;">
    <div class="action-bubble">思考中 12s</div>
    <div class="avatar-wrap">
      <div class="opponent-acting-timer-ring"></div>
      <img class="avatar-img" src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=100&auto=format&fit=crop&q=80">
    </div>
    <div class="seat-name">右侧玩家</div>
    <div class="seat-chips">1.2K BB</div>
  </div>

  <!-- 其他座位 -->
  <div class="seat-node" style="top: 92px; left: 50%; transform: translateX(-50%);">
    <div class="avatar-wrap"><img class="avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80"></div>
    <div class="seat-name">顶部甲</div>
    <div class="seat-chips">1K BB</div>
  </div>
  <div class="seat-node" style="top: 130px; left: 28px;">
    <div class="avatar-wrap"><img class="avatar-img" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=100&auto=format&fit=crop&q=80"></div>
    <div class="seat-name">左上玩家</div>
    <div class="seat-chips">980 BB</div>
  </div>

  <!-- 本人玩家组 (等待中) -->
  <div class="self-player-group">
    <!-- 本人手牌与余额 -->
    <div class="self-hand-center">
      <div class="self-cards-row">
        <div class="poker-card red"><div class="val">Q</div><div>♥</div></div>
        <div class="poker-card red"><div class="val">J</div><div>♥</div></div>
      </div>
      <div style="font-size: 11px; color: #FFEAA7; font-weight: 800; margin-top: 4px;">本人余额: 1,020 BB</div>
    </div>

    <!-- 状态指示文案 -->
    <div class="waiting-status-toast">
      <div class="waiting-dot"></div>
      <span>等待 右侧玩家 行动... (已开启自动预选)</span>
    </div>

    <!-- 自动操作预选区 (4个选项：自动弃牌/让或弃/自动跟注/跟任意) -->
    <div class="auto-operation-bar">
      <!-- 选项1: 自动弃牌 (默认未选) -->
      <div class="auto-op-pill">
        <div class="auto-checkbox"></div>
        <div class="auto-op-label">
          <span class="main-txt">自动弃牌</span>
          <span class="sub-txt">轮到直接弃</span>
        </div>
      </div>

      <!-- 选项2: 让牌/弃牌 (已选中) -->
      <div class="auto-op-pill selected">
        <div class="auto-checkbox">✓</div>
        <div class="auto-op-label">
          <span class="main-txt">让牌 / 弃牌</span>
          <span class="sub-txt">可让则让</span>
        </div>
      </div>

      <!-- 选项3: 自动跟注 (未选) -->
      <div class="auto-op-pill">
        <div class="auto-checkbox"></div>
        <div class="auto-op-label">
          <span class="main-txt">跟注 4 BB</span>
          <span class="sub-txt">限额跟注</span>
        </div>
      </div>

      <!-- 选项4: 跟任意注 (禁用状态，例如超出限额) -->
      <div class="auto-op-pill disabled">
        <div class="auto-checkbox">✕</div>
        <div class="auto-op-label">
          <span class="main-txt">跟任意注</span>
          <span class="sub-txt">暂不可用</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部黑胶栏 -->
  <div class="bottom-dock">
    <div class="dock-item"><span>🏆</span><span>战绩</span></div>
    <div class="dock-item"><span>🎖</span><span>牌谱</span></div>
    <div class="dock-item"><span>😊</span><span>表情</span></div>
  </div>
</div>
</body>
</html>
